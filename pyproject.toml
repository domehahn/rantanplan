[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rantanplan"
version = "0.2.1"
description = "Oracle-gated metamorphic testing that scores how easily AI agent security scanners can be fooled"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "domehahn" }]
keywords = ["ai-security", "metamorphic-testing", "agent-skills", "mcp", "scanner-evaluation", "llm-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.29.1",
    "rich>=15.0.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
]

[project.urls]
Homepage = "https://github.com/domehahn/rantanplan"
Issues = "https://github.com/domehahn/rantanplan/issues"
Changelog = "https://github.com/domehahn/rantanplan/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
]

[project.scripts]
rantanplan = "rantanplan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rantanplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = false
