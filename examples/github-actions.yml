name: Scanner Assurance Gate

# Scores a scanner with Rantanplan and fails the job if the grade is below B.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rantanplan
        run: uv tool install git+https://github.com/domehahn/rantanplan@v0.2.1

      # Install or build the scanner under test here and put it on PATH.

      - name: Score the scanner
        run: |
          rantanplan test scanner --target skil --seed 42151 \
            --format json --output rantanplan-results.json

      - name: Gate (fails on grade < B, INCOMPLETE or low confidence)
        run: rantanplan gate --results rantanplan-results.json --min-grade B

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rantanplan-results
          path: rantanplan-results.json
