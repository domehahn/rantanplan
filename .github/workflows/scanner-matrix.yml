name: Rantanplan Scanner Matrix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scanner: [skil, skillspector, garak, skillevaluator]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Run Scanner Conformance for ${{ matrix.scanner }}
        run: |
          uv run rantanplan suite offline-core

