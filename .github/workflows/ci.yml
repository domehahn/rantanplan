name: Rantanplan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  offline-core-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Run Ruff Linter
        run: |
          uv run ruff check .

      - name: Run Pytest Test Suite (coverage gate)
        run: |
          uv run pytest -v --cov=rantanplan --cov-report=term --cov-fail-under=90

      - name: Verify corpus labels against reference semantics
        run: |
          uv run rantanplan verify-ground-truth

      - name: Check generated corpus is up to date
        run: |
          uv run rantanplan corpus build --out corpus
          git diff --exit-code -- corpus

      - name: Calibrate the scoring scale (blind < naive < strict)
        run: |
          uv run rantanplan suite offline-core

      - name: Check reference benchmark is up to date
        run: |
          uv run rantanplan benchmark --output docs/REFERENCE_BENCHMARK.md
          git diff --exit-code -- docs/REFERENCE_BENCHMARK.md

      - name: Run System & Scanner Doctor
        run: |
          uv run rantanplan doctor

      - name: Run Offline-Core Benchmark Demo Matrix
        run: |
          uv run rantanplan demo

